<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARALLAX — A Universe Beyond Observation | Multi-Scale Cosmological Simulator</title>
  <meta
    name="description"
    content="PARALLAX is a procedural, infinite, persistent multi-scale universe simulator with WebGL2 volumetric raymarching — from cosmic web filaments down to planetary biospheres and civilizations."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./src/styles/index.css" />
</head>
<body>
  <!-- Fullscreen WebGL2 Volumetric Raymarching & 3D Astrographic Projection Viewport -->
  <main id="viewport-container" aria-label="3D Universe Simulation Viewport">
    <canvas id="webgl-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </main>

  <!-- Scientific Observatory Telemetry HUD -->
  <div id="hud-layer">
    <!-- 1. Top Telemetry & Cosmic Breadcrumb Header -->
    <header id="top-telemetry-bar" class="hud-panel">
      <div class="brand-cluster">
        <div class="brand-mark">
          <span class="brand-reticle" aria-hidden="true"></span>
          <h1 class="brand-title">PARALLAX</h1>
        </div>
        <span class="brand-subtitle">A Universe Beyond Observation</span>
      </div>

      <nav id="cosmic-breadcrumb" class="cosmic-breadcrumb" aria-label="Cosmic Hierarchy"></nav>

      <div class="top-controls-cluster">
        <div class="seed-input-group" title="Deterministic Universe Seed">
          <label for="seed-input" class="seed-label">SEED</label>
          <input id="seed-input" type="text" value="PARALLAX-2026-OMEGA" spellcheck="false" />
        </div>
        <button id="btn-apply-seed" class="icon-btn" title="Regenerate or tune universe seed coordinates">
          TUNE SEED
        </button>
        <button
          id="btn-seti-scanner"
          class="action-btn accent-emerald"
          title="Scan sector and jump to the next exoplanet with an active Biosphere or Civilization"
        >
          ◉ BIO / SETI SCAN
        </button>
        <button id="btn-bookmark" class="icon-btn" title="Save current coordinates to persistent bookmarks">
          ★ BOOKMARK
        </button>
        <button id="btn-audio" class="icon-btn" title="Toggle WebAudio Deep Space acoustic synthesis">
          AUDIO: OFF
        </button>
        <button id="btn-zen" class="icon-btn" title="Pure Observation Mode (Key H)">
          HUD: FULL
        </button>
      </div>
    </header>

    <!-- 2. Middle Workspace: Left Scale Ladder & Catalog + Right Scientific Dossier -->
    <div id="middle-workspace">
      <!-- Left Panel: Continuous Logarithmic Scale & Spatial Object Catalog -->
      <aside id="left-navigator-panel" class="hud-panel" aria-label="Spatial Scale and Catalog">
        <div class="panel-header">
          <span class="panel-title">Continuous Spatial Scale</span>
          <span id="scale-exponent-tag" class="scale-exponent-tag">10^24.60 m</span>
        </div>

        <div class="scale-ladder-section">
          <div class="scale-readout-row">
            <span style="font-size:11px;color:var(--text-secondary)">Field of View (FOV)</span>
            <span id="scale-metric-big" class="scale-metric-big">1.29 Gpc</span>
          </div>
          <input
            id="scale-slider"
            type="range"
            min="0.0"
            max="25.5"
            step="0.05"
            value="24.6"
            aria-label="Logarithmic spatial scale slider"
          />
          <div id="scale-presets-grid" class="scale-presets-grid"></div>
        </div>

        <div class="panel-header">
          <span id="catalog-header-title" class="panel-title">Cosmic Superclusters</span>
          <span id="catalog-count-badge" class="panel-badge">14 nodes</span>
        </div>

        <div id="catalog-list-container" class="catalog-list-container"></div>
      </aside>

      <!-- Right Panel: Multi-Tab Scientific Dossier & Telemetry Inspector -->
      <aside id="right-dossier-panel" class="hud-panel" aria-label="Scientific Dossier and Spectrometry">
        <div class="dossier-entity-hero">
          <div id="entity-category-overline" class="entity-category-overline">COSMOLOGICAL STRUCTURE</div>
          <div class="entity-title-row">
            <h2 id="entity-main-title" class="entity-main-title">Laniakea-Prime Supercluster</h2>
            <span id="entity-catalog-code" class="entity-catalog-code">PCL-N0000</span>
          </div>
        </div>

        <div class="dossier-tabs" role="tablist">
          <button class="dossier-tab-btn active" data-tab="physics" role="tab">1. Physics</button>
          <button class="dossier-tab-btn" data-tab="climate" role="tab">2. Climate</button>
          <button class="dossier-tab-btn" data-tab="life" role="tab">3. Life</button>
          <button class="dossier-tab-btn" data-tab="civ" role="tab">4. Civ</button>
        </div>

        <div id="dossier-content-scroll" class="dossier-content-scroll"></div>
      </aside>
    </div>

    <!-- 3. Bottom Temporal Simulation & Causal Phenomena Dock -->
    <footer id="bottom-temporal-dock" class="hud-panel" aria-label="Time Dilation and Cosmic Events">
      <div class="time-controls-cluster">
        <div class="epoch-clock-box">
          <span class="epoch-overline">Universal Cosmic Epoch</span>
          <span id="epoch-time-val" class="epoch-time-val">13.8000 Gyr (+0.0 h)</span>
        </div>
        <div id="time-speed-pills" class="time-speed-pills" role="group" aria-label="Time Multiplier"></div>
      </div>

      <div class="live-event-ticker" title="Autonomous real-time log of cosmic events across the universe">
        <span class="ticker-pulse-dot" aria-hidden="true"></span>
        <span id="live-ticker-text" class="ticker-text">Tuning PARALLAX telemetry...</span>
      </div>

      <div class="phenomena-actions-cluster">
        <button
          id="btn-phenom-star"
          class="action-btn"
          title="Advance host star astrophysical evolution along the H-R diagram (+Gyr)"
        >
          ✦ Stellar Evolution
        </button>
        <button
          id="btn-phenom-impact"
          class="action-btn"
          title="Simulate an asteroid bolide impact on the active planet with climatic and evolutionary effects"
        >
          ☄ Bolide Impact
        </button>
        <button
          id="btn-phenom-bio"
          class="action-btn accent-emerald"
          title="Catalyze abiogenesis or accelerate evolutionary radiation of the biosphere"
        >
          ❋ Evolution Surge
        </button>
        <button
          id="btn-phenom-civ"
          class="action-btn accent-amber"
          title="Trigger a Kardashev technological breakthrough and construct orbital megastructures"
        >
          ⬡ Kardashev Leap
        </button>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
