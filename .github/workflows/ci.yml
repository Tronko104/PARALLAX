name: PARALLAX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check ES module syntax
        run: |
          for file in src/*.js src/**/*.js scripts/*.js; do
            echo "Checking $file..."
            node --check "$file"
          done

      - name: Build standalone bundle and verify simulation engine
        run: |
          npm run bundle
          node -e "
            import fs from 'node:fs';
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const match = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!match) throw new Error('Missing inline script in dist/index.html');
            fs.writeFileSync('/tmp/bundle_check.js', match[1]);
          "
          node --check /tmp/bundle_check.js
          node -e "
            import('./src/simulation/engine.js').then(({ SimulationEngine }) => {
              const eng = new SimulationEngine();
              if (!eng.getActiveSupercluster() || !eng.getActiveGalaxy() || !eng.getActivePlanet()) {
                throw new Error('Failed to generate universe hierarchy');
              }
              eng.step(0.1);
              eng.triggerPhenomenon('stellar_evolution_step');
              eng.triggerPhenomenon('abiogenesis_surge');
              eng.triggerPhenomenon('kardashev_breakthrough');
              console.log('Simulation smoke test passed:', eng.getActivePlanet().name);
            });
          "
